name: Build Windows installer

# Push a tag like v0.2.0 to publish a GitHub Release with the Windows
# installer. Any push/PR runs the tests; "Run workflow" on the Actions tab
# builds the installer you can download from the run page.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code-signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: RetroConnect-windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            <!-- guide -->
            **New here?** Download **RetroConnect-Setup.exe** below and follow the [setup guide](https://github.com/phantomdenied/RetroConnect/blob/main/FRIEND-GUIDE.md).
            Already have RetroConnect? It offers this update by itself.
            <!-- /guide -->

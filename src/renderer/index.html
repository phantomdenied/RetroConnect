<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: rcthumb:">
  <title>RetroConnect</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-pixel.css" id="theme-css">
</head>
<body>
  <!-- Backdrop. Each theme styles its own parts; the others stay empty.
       synthwave: stars, striped sun, mountains, moving grid.
       pixel: clouds, hills, floating blocks, coins, ground, a little robot.
       space: nebula, star layers, planet, asteroids, a drone wave, the player's fighter. -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="floor"><div class="grid"></div></div>
    <div class="px-layer px-clouds far"></div>
    <div class="px-layer px-clouds"></div>
    <div class="px-layer px-hills-far"></div>
    <div class="px-layer px-hills-near"></div>
    <div class="px-layer px-platforms"></div>
    <div class="px-coins"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="px-layer px-ground"></div>
    <div class="px-hero"></div>
    <div class="sp-nebula"></div>
    <div class="sp-layer sp-stars-far"></div>
    <div class="sp-layer sp-stars-mid"></div>
    <div class="sp-planet"></div>
    <div class="sp-layer sp-stars-near"></div>
    <div class="sp-rock r1"></div>
    <div class="sp-rock r2"></div>
    <div class="sp-wave"><i></i><i></i><i class="hit"></i><i></i><i></i><b class="sp-boom"></b></div>
    <div class="sp-player"><span class="sp-shot"></span><span class="sp-shot two"></span><span class="sp-flame"></span><span class="sp-flame two"></span></div>
  </div>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="9" width="26" height="15" rx="7" fill="currentColor"/>
          <rect x="8" y="13" width="2.5" height="7" fill="var(--bg)"/>
          <rect x="5.75" y="15.25" width="7" height="2.5" fill="var(--bg)"/>
          <circle cx="21" cy="15" r="1.8" fill="var(--bg)"/>
          <circle cx="24.5" cy="18.5" r="1.8" fill="var(--bg)"/>
        </svg>
        <span>RetroConnect</span>
        <small class="studio">?God Complex Studios</small>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="games">Games</button>
        <button class="nav-item" data-view="friend" id="nav-friend">Friend's games</button>
        <button class="nav-item" data-view="files" id="nav-files">Files</button>
        <button class="nav-item" data-view="buddy">Connect</button>
        <button class="nav-item" data-view="retroarch">RetroArch</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>
      <div id="discord-slot"></div>
      <div id="buddy-card" class="buddy-card"></div>
    </aside>

    <main class="main">
      <div id="banner"></div>
      <section id="view-games" class="view"></section>
      <section id="view-friend" class="view" hidden></section>
      <section id="view-files" class="view" hidden></section>
      <section id="view-buddy" class="view" hidden></section>
      <section id="view-retroarch" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>

    <footer id="activity" class="activity">
      <div class="activity-bar">
        <span id="activity-status" class="activity-status">Ready</span>
        <div id="progress" class="progress" hidden><div class="progress-fill"></div><span class="progress-label"></span></div>
        <button id="activity-toggle" class="link-btn">Activity</button>
      </div>
      <ol id="log" class="log" hidden></ol>
    </footer>
  </div>

  <div id="wizard" class="wizard" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>

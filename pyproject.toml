[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retroconnect"
version = "0.1.0"
description = "Play RetroArch netplay with a friend: sync cores and ROMs, then host or join in one command."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
retroconnect = "retroconnect.cli:main"

[tool.setuptools]
packages = ["retroconnect"]
